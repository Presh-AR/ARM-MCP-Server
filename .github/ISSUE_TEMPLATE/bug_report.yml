name: Bug report
description: Report a reproducible ARM MCP Server defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, customer data, or tenant-specific identifiers.
  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js version, operating system, and MCP client
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest sanitized sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized MCP or server output when relevant.
    validations:
      required: true
